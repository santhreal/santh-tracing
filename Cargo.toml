[package]
name = "santh-tracing"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
homepage = "https://santh.dev"
repository = "https://github.com/santhreal/santh-tracing"
documentation = "https://docs.rs/santh-tracing"
description = "Consistent tracing setup for CLI tools  -  stderr/JSON/file sinks, a secret-redacting writer, and operation spans"
keywords = ["tracing", "logging", "observability", "cli"]
categories = ["development-tools::debugging", "command-line-interface"]
readme = "README.md"
publish = true

[package.metadata.santh]
status = "beta"

[dependencies]
santh-error = { version = "0.2.0" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
prometheus = { version = "=0.14.0", optional = true }

[features]
default = []
# Swap the no-op metrics facade for a Prometheus-backed one (see
# `src/metrics/prom.rs`). Off by default; metrics are no-ops unless enabled.
prometheus = ["dep:prometheus"]

[dev-dependencies]
criterion = { version = "0.5.1" }
proptest = { version = "1.9.0" }
